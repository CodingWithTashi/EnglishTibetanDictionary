name: Android CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call: # lets a release workflow reuse these checks before shipping.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON is empty or missing. Add the base64-encoded app/google-services.json under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build, unit test and lint (debug)
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Check the release manifest for Advertising ID permissions
        # firebase-analytics merges AD_ID and the AdServices permissions in; app/src/main/AndroidManifest.xml removes
        # them. Fail if any of them reaches the merged release manifest.
        run: |
          ./gradlew :app:processReleaseManifest --no-daemon --stacktrace
          manifest=app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if [ ! -f "$manifest" ]; then
            echo "::error::Merged release manifest not found at $manifest."
            exit 1
          fi
          if grep -nE 'AD_ID|ADSERVICES' "$manifest"; then
            echo "::error::The merged release manifest requests the Advertising ID or AdServices (lines above). Remove them in app/src/main/AndroidManifest.xml with tools:node=\"remove\"."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  dictionary-pipeline:
    # tools/dictionary builds the bundled pack databases (assets/dictionary/<pack>.db). Its tests need no source data:
    # without MLDIC_SOURCE and DZONGKHA_SOURCE the smoke tests that read them skip.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dictionary
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the pipeline's requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run the pipeline tests
        run: .venv/bin/python -I -m pytest -q

  translation-backend:
    # backend/functions: the translate and getTranslationStatus Cloud Functions. Unit tests run on Node; the quota,
    # cache and security-rules tests run against the Firestore emulator, which needs Java 21+.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('backend/functions/package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Format, lint and typecheck
        run: npm run format:check && npm run lint && npm run typecheck

      # The coverage runs are the unit and emulator tests, plus the thresholds in vitest*.config.ts.
      - name: Unit tests with coverage
        run: npm run coverage

      - name: Emulator tests with coverage
        run: npm run coverage:emulator

      - name: Build
        run: npm run build
