# Build pipeline for the app's prebuilt dictionary databases (see README.md).
# Run the tests from this directory with:  .venv/bin/python -I -m pytest -q

[tool.pytest.ini_options]
# -I (isolated mode) keeps the cwd off sys.path, so the package root is added here.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = ["slow: reads the real Monlam or Dzongkha source files, opt-in through MLDIC_SOURCE or DZONGKHA_SOURCE (deselect with -m \"not slow\")"]
